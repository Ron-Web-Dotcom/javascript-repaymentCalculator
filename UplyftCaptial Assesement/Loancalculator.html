<!DOCTYPE html>
<html lang="en">
<head>
 <!--Responsive Web Form-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Loan Calculator</title>
<!-- Bootsstrap style sheet-->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
	 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.4.1/css/bootstrap-datepicker3.css"/>
<link  rel="stylesheet" href="css/layout.css"/>

</head>

<body>
<!--Fixed Navigation Bar-->
<div class="bs-example">
    <nav class="navbar navbar-expand-md navbar-light bg-light">
        <a href="#" class="navbar-brand">
            <img src="logo.png" height="25" alt="LoanCalculator">
        </a>
        <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">     
        </div>
    </nav>
</div>

<h1>Loan Repayment Calculator</h1>

<!--Form for the loan Calculation-->
   <div class="container">
    
       <form class="repayment">
        <div class="form-group" id="loanTextError">
            <div class="row">
                <div class="col-25">
              <label for="loanInput">Loan Amount:</label>
              </div>
              <div class="col-75">
            <input type="text" inputmode="decimal" id="loanInput" placeholder="Please Enter Loan Amount..">
            <label class="message"> Invalid Loan Amount</label>
              </div>
          </div>
        </div>

           <div class="form-group" id="installmentTextError">
            <div class="row">
                <div class="col-25">
            <label for="installmentInput">Installment Amount:</label>
                </div>
                <div class="col-75">
            <input type="text" inputmode="decimal" id="installmentInput" placeholder="Please Enter Installment Amount..">
            <label class="message"> Invalid Installment Amount </label>
          </div>
            </div>
           </div>

           <div class="form-group" id="interestTextError">
            <div class="row">
                <div class="col-25">
            <label for="interestInput">Interest Rate:</label>
                </div>
                <div class="col-75">
            <div class="input-group">
              <input type="text" inputmode="decimal" id="interestInput" class="form-control" placeholder="Please Enter Interest Rate..">
              <div class="input-group-append">
                <span class="input-group-text">%</span>
              </div>
            </div>
            <label class="message"> Invalid Interest Rate</label>
          </div>
            </div>
           </div>

          <div class="form-group" id="intervalTextError">
            <div class="row">
                <div class="col-25">  
              <label for="intervalInput">Installment Interval:</label>
                </div>
                <div class="col-75">
              <select  id="intervalInput">
                <option>Daily</option>
                <option>Weekly</option>
                <option>Monthly</option>
              </select>
              <label class="message"> Invalid Intervals </label>
            </div>
            </div>
          </div>

           <div class="form-group" id="dateTextError">
            <div class="row">
                <div class="col-25">  
              <label class="control-label" for="dateInput">Date:</label>
                </div>
                <div class="col-75">
              <input class="startdate" id="dateInput" name="date" placeholder="MM/DD/YYYY" type="text"/>
            <label class="message">  Invalid Date-Picker</label>
                </div>
            </div>
           </div>

           <div class="row mt-3">
             <div class="col-sm-6 mb-2">
               <button class="btn btn-success btn-lg btn-block" id="RunProgram">Calculate</button>
             </div>
             <div class="col-sm-6 mb-2">
               <button class="btn btn-secondary btn-lg btn-block" id="ResetForm" type="button">Reset</button>
             </div>
           </div>
     </form>
   </div>

<!--Schdule of the table will appear here-->
         <div id="result"></div>

<!-- Bootstrap Date-Picker Plugin -->
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.4.1/js/bootstrap-datepicker.min.js"></script>
<!-- Custom library -->
<script src="javascript/function.js"></script>
</body>
</html>
